name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Gradle itself always runs on JDK 21. The matrix chooses which JDK compiles and runs the code
  # (-PjavaVersion), so the leg called "25" builds, tests and mutates the project on JDK 25.
  unit:
    name: Build and unit tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run unit specs
        run: ./gradlew assemble test -PjavaVersion=${{ matrix.java }} --console=plain
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-jdk${{ matrix.java }}
          path: build/reports/tests/test

  integration:
    name: Integration tests (Testcontainers, JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run integration specs against PostgreSQL 16 and Redis 7
        run: ./gradlew integrationTest -PjavaVersion=${{ matrix.java }} --console=plain
      - name: Stress and isolation numbers
        if: always()
        run: |
          echo '## Stress, concurrency and isolation (JDK ${{ matrix.java }})' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          for path in sorted(glob.glob('build/test-results/integrationTest/*.xml')):
              for line in open(path, errors='replace'):
                  if line.strip().startswith(('CONCURRENCY', 'STRESS', 'ISOLATION')):
                      print('- `' + line.strip() + '`')
          PY
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report-jdk${{ matrix.java }}
          path: build/reports/tests/integrationTest

  mutation:
    name: Mutation testing (PIT, JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run PIT on the domain package
        run: ./gradlew pitest -PjavaVersion=${{ matrix.java }} --console=plain
      - name: Publish mutation score
        if: always()
        run: |
          if [ -f build/reports/pitest/mutations.xml ]; then
            python3 scripts/pit-summary.py build/reports/pitest/mutations.xml >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report-jdk${{ matrix.java }}
          path: build/reports/pitest

  docker:
    name: Docker image, compose smoke test and image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start app, PostgreSQL and Redis
        run: docker compose up --build -d --wait
      - name: Smoke test
        run: ./scripts/smoke.sh http://localhost:8080
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
      - name: Build the image again for scanning
        run: docker build -t ledger-lab:ci .
      - name: Scan the image for known vulnerabilities (Trivy)
        # Fails the CI run on HIGH or CRITICAL findings that have a fix available. Findings without a fix are listed
        # in the log by the next step but do not block, because there is nothing to upgrade to.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ledger-lab:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
      - name: List unfixed findings (information only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ledger-lab:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          vuln-type: os,library

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the working tree and the history
        # The gitleaks binary is used directly: the gitleaks-action needs a licence key for organisation repositories.
        run: |
          version=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
