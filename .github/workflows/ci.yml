name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run unit specs
        run: ./gradlew assemble test --console=plain
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/tests/test

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run integration specs against PostgreSQL 16 and Redis 7
        run: ./gradlew integrationTest --console=plain
      - name: Concurrency test numbers
        if: always()
        run: |
          echo '## Concurrency test' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, re
          for path in glob.glob('build/test-results/integrationTest/*Concurrency*.xml'):
              for line in open(path, errors='replace'):
                  if line.startswith('CONCURRENCY'):
                      print('- `' + line.strip() + '`')
          PY
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: build/reports/tests/integrationTest

  mutation:
    name: Mutation testing (PIT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run PIT on the domain package
        run: ./gradlew pitest --console=plain
      - name: Publish mutation score
        if: always()
        run: |
          if [ -f build/reports/pitest/mutations.xml ]; then
            python3 scripts/pit-summary.py build/reports/pitest/mutations.xml >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: build/reports/pitest

  docker:
    name: Docker image and compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start app, PostgreSQL and Redis
        run: docker compose up --build -d --wait
      - name: Smoke test
        run: ./scripts/smoke.sh http://localhost:8080
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
