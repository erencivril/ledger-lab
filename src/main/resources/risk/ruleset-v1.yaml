version: 1
description: Amount rules only. A baseline to compare later versions against.
stack:
  warnings: 0
  stepUps: 0
rules:
  # A large first payment is held for a person to look at.
  - id: FIRST_PAYMENT_LARGE
    action: HOLD
    params:
      minAmountUsd: 1000
  # A payment much bigger than the sender's usual one needs a second confirmation.
  - id: AMOUNT_DEVIATION
    action: STEP_UP
    params:
      factor: 5
      minHistory: 3
  # A payee account opened in the last 3 days is only a warning on its own.
  - id: NEW_PAYEE_ACCOUNT
    action: WARN
    params:
      maxAgeHours: 72
      minAmountUsd: 300
