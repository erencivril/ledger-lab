plugins {
    id 'java'
    id 'groovy'
    id 'application'
    id 'nu.studer.jooq' version '10.1.1'
    id 'info.solidsoft.pitest' version '1.15.0'
}

group = 'dev.erencivril'
version = '0.1.0'

java {
    toolchain {
        // 21 by default. CI also builds and tests with -PjavaVersion=25.
        languageVersion = JavaLanguageVersion.of((findProperty('javaVersion') ?: '21') as int)
    }
}

application {
    mainClass = 'dev.erencivril.ledger.Main'
    applicationDefaultJvmArgs = ['-XX:MaxRAMPercentage=75']
}

repositories {
    mavenCentral()
}

ext {
    jooqVersion = '3.20.20'
    flywayVersion = '11.20.3'
    jacksonVersion = '2.22.4'
    spockVersion = '2.4-groovy-4.0'
    groovyVersion = '4.0.33'
    testcontainersVersion = '2.0.5'
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    benchmarkImplementation.extendsFrom implementation
    benchmarkRuntimeOnly.extendsFrom runtimeOnly
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    benchmark {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// SparkJava 2.9.4 brings Jetty 9.4.48. Pin Jetty to 9.4.58, the last open-source 9.4 release,
// which fixes CVE-2024-13009. See docs/adr/0006 for the Jetty issues that remain.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.eclipse.jetty' && details.requested.version?.startsWith('9.4.')) {
            details.useVersion '9.4.58.v20250814'
            details.because 'last open-source Jetty 9.4 release'
        }
    }
}

dependencies {
    implementation "com.sparkjava:spark-core:2.9.4"
    implementation "org.jooq:jooq:${jooqVersion}"
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-database-postgresql:${flywayVersion}"
    implementation "org.postgresql:postgresql:42.7.14"
    implementation "com.zaxxer:HikariCP:7.1.0"
    implementation "redis.clients:jedis:5.2.0"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${jacksonVersion}"
    implementation "org.slf4j:slf4j-api:2.0.20"
    runtimeOnly "ch.qos.logback:logback-classic:1.5.38"

    jooqGenerator "org.jooq:jooq-meta-extensions:${jooqVersion}"
    jooqGenerator "org.slf4j:slf4j-simple:2.0.20"

    testImplementation platform("org.apache.groovy:groovy-bom:${groovyVersion}")
    testImplementation "org.apache.groovy:groovy"
    testImplementation "org.spockframework:spock-core:${spockVersion}"
    testImplementation "org.apache.groovy:groovy-sql"
    testImplementation "org.apache.groovy:groovy-json"
    testImplementation "com.tngtech.archunit:archunit:1.5.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    integrationTestImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
    integrationTestImplementation "org.testcontainers:testcontainers-postgresql:${testcontainersVersion}"

    benchmarkImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
    benchmarkImplementation "org.testcontainers:testcontainers-postgresql:${testcontainersVersion}"
}

jooq {
    version = jooqVersion
    edition = nu.studer.gradle.jooq.JooqEdition.OSS

    configurations {
        main {
            // Generates the jOOQ classes from the Flyway migrations, so the
            // build needs no running database.
            generateSchemaSourceOnCompilation = true
            generationTool {
                logging = org.jooq.meta.jaxb.Logging.WARN
                generator {
                    name = 'org.jooq.codegen.JavaGenerator'
                    database {
                        name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                        properties {
                            property {
                                key = 'scripts'
                                value = 'src/main/resources/db/migration/*.sql'
                            }
                            property {
                                key = 'sort'
                                value = 'flyway'
                            }
                            property {
                                key = 'defaultNameCase'
                                value = 'lower'
                            }
                        }
                    }
                    generate {
                        deprecated = false
                        records = true
                        immutablePojos = false
                        fluentSetters = false
                        javaTimeTypes = true
                    }
                    target {
                        packageName = 'dev.erencivril.ledger.persistence.jooq'
                        directory = "${buildDir}/generated-src/jooq/main"
                    }
                    strategy.name = 'org.jooq.codegen.DefaultGeneratorStrategy'
                }
            }
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '512m'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs the integration specs against real PostgreSQL and Redis (Testcontainers).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    testLogging.showStandardStreams = true
}

// The load runner behind docs/benchmarks.md. Needs Docker. Options: -Dbench.transfers=3000 -Dbench.threads=16
// -Dbench.runs=3 -Dbench.seed=20261110 (pass them with -PbenchArgs="-Dbench.runs=5" or edit the defaults in BenchmarkMain).
tasks.register('benchmark', JavaExec) {
    description = 'Runs the three locking strategies against a normal and a hot-account workload and prints a Markdown report.'
    group = 'verification'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'dev.erencivril.ledger.benchmark.BenchmarkMain'
    maxHeapSize = '512m'
    if (project.hasProperty('benchArgs')) {
        jvmArgs project.property('benchArgs').toString().split(' ')
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

pitest {
    pitestVersion = '1.30.2'
    junit5PluginVersion = '1.2.3'
    targetClasses = ['dev.erencivril.ledger.domain.*']
    targetTests = ['dev.erencivril.ledger.domain.*']
    threads = 2
    mutators = ['STRONGER']
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    mutationThreshold = 90
    // Run the PIT worker on the same JDK that compiled the classes (21 by default, 25 with -PjavaVersion=25).
    // Without this the worker would use the JDK that runs Gradle and could not load newer class files.
    jvmPath = javaToolchains.launcherFor(java.toolchain).map { it.executablePath }
}
